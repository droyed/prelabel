# =============================================================================
# pyproject.toml — prelabel
# Python toolkit for bridging YOLO/SAM predictions with Label Studio workflows.
# =============================================================================

# -----------------------------------------------------------------------------
# BUILD SYSTEM
# Hatchling is the PyPA-recommended modern build backend.
# It is fetched automatically into an isolated build env by pip/build —
# you do NOT need to pre-install it.
# -----------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


# -----------------------------------------------------------------------------
# PROJECT METADATA  (PEP 621)
# -----------------------------------------------------------------------------
[project]
name = "prelabel"
version = "1.0.0"
description = "Toolkit for bridging YOLO/SAM model predictions with Label Studio annotation workflows."
readme = "README.md"
license = { text = "MIT" }
authors = []
keywords = ["label-studio", "yolo", "sam", "annotation", "machine-learning", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"

# Core dependencies: only what the Label Studio REST client needs.
# Lightweight — does NOT pull in PyTorch or OpenCV.
dependencies = [
    "requests>=2.28.0",
    "label-studio==1.22.0",
    "ultralytics==8.3.237",
    "numpy>=1.24.0",
    "ftfy>=6.1.1",
    "iopath>=0.1.10",
    "timm>=1.0.24",
    "label-studio-converter>=0.0.50",
    "imtools @ git+https://github.com/droyed/imtools.git",
]

# -----------------------------------------------------------------------------
# OPTIONAL DEPENDENCY GROUPS
# -----------------------------------------------------------------------------
[project.optional-dependencies]

# Development and testing tools.
# pip install prelabel[dev]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=4.0.0",
]

# Install everything.
# pip install prelabel[all]
all = [
    "prelabel[dev]",
]

# =============================================================================
# HATCHLING BUILD CONFIGURATION
# =============================================================================

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# Explicit src-layout package declaration.
packages = ["src/prelabel"]

# Exclude everything that should never go into a wheel.
exclude = [
    "assets/",
    "demos/",
    "tests/",
    ".claude/",
    "**/__pycache__/",
    "**/*.pyc",
    "**/*.pyo",
    "**/*.pt",     # PyTorch model weights (covers sam3.pt and any future weights)
    "**/*.pth",
    "**/*.onnx",
]

[tool.hatch.build.targets.sdist]
# Source dist includes tests and demos for reproducibility,
# but excludes model weights and generated artifacts.
exclude = [
    ".claude/",
    "**/__pycache__/",
    "**/*.pyc",
    "**/*.pyo",
    "**/*.pt",
    "**/*.pth",
    "**/*.onnx",
]


# =============================================================================
# PYTEST CONFIGURATION
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"


# =============================================================================
# COVERAGE CONFIGURATION
# =============================================================================

[tool.coverage.run]
source = ["src/prelabel"]
omit = ["tests/*", "demos/*"]

[tool.coverage.report]
show_missing = true
